name: Guardrails & Empirical Matrix

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Pinned Dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run Layer 1 Schema Probe
        run: python scripts/schema-probe.py
      - name: Run Layer 2 Data Payload Probe
        run: python scripts/data-probe.py
      - name: Run Layer 4 Guardrail & Tests Suite
        run: python3 guardrails/guardrail.py --mode all
