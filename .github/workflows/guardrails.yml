name: Strict guardrails

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the shared strict gate
        run: python3 guardrails/guardrail.py --mode all
