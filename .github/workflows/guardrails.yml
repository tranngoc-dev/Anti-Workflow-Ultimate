name: Strict guardrails

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the shared strict gate
        run: python3 guardrails/guardrail.py --mode all
